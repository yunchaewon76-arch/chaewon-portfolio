const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang='ko',filter='all';
function renderGallery(){
  const d=DATA[lang],keys=['all','catalogue','brochure','usp','flyer'];
  const chosen=PUBLISHED_PDFS.filter(item=>filter==='all'||item.kind===filter);
  const category=d.categoryNotes[filter]||d.categoryNotes.all;
  $('category-context').innerHTML='<h3>'+esc(category[0])+'</h3><p>'+esc(category[1])+'</p>';
  $('gallery-filters').innerHTML=keys.map((key,i)=>'<button type="button" class="filter '+(filter===key?'active':'')+'" data-filter="'+key+'">'+esc(d.filters[i])+'</button>').join('');
  $('gallery-grid').innerHTML=chosen.map(item=>{
    const title=item.name;
    const preview=item.thumb
      ? '<img class="real-cover-photo" loading="lazy" src="'+esc(item.thumb)+'" alt="'+esc(title)+' — 실제 원본 첫 페이지">'
      : '<div class="pdf-preview no-cover"><span>PDF</span><small>'+esc(d.coverPending)+'</small></div>';
    const sourceLabel=item.url.includes('disk.360.yandex.ru')?'YANDEX DISK':'DIO RUSSIA';
    return '<a class="gallery-item" href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(title)+' — '+esc(d.pdfLabel)+'">'+preview+'<span class="item-caption"><small>'+sourceLabel+' · '+esc(d.originalLabel)+'</small><strong>'+esc(title)+'</strong><span class="pdf-open">'+esc(d.pdfLabel)+'</span></span></a>';
  }).join('');
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;renderGallery()}));
}
