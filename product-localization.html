const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang='ko',filter='all';
function renderGallery(){const d=DATA[lang],arr=GALLERY.filter(item=>filter==='all'||item.kind===filter);$('gallery-grid').innerHTML=arr.map(x=>'<button type="button" class="gallery-item" data-slug="'+x.slug+'"><img src="'+x.src+'" alt="'+esc(x.title[lang])+'" loading="lazy"/><span class="item-caption"><small>'+esc(({catalogue:'CATALOGUE',usp:'USP',flyer:'FLYER'})[x.kind])+'</small><strong>'+esc(x.title[lang])+'</strong></span></button>').join('');

document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;renderGallery()}));document.querySelectorAll('[data-slug]').forEach(b=>b.addEventListener('click',()=>{const item=GALLERY.find(x=>x.slug===b.dataset.slug);$('lightbox-image').src=item.src;$('lightbox-image').alt=item.title[lang];$('lightbox-caption').textContent=item.title[lang]+' · Public-safe excerpt';$('lightbox').classList.add('open');document.body.style.overflow='hidden';$('lightbox-close').focus()}));}
function setLang(l){lang=DATA[l]?l:'ko';const d=DATA[lang];document.documentElement.lang=lang;const simple={'detail-back':d.back,'detail-kicker':d.eyebrow,'detail-lead':d.lead,'process-title':d.processTitle,'gallery-title':d.galleryTitle,'gallery-description':d.galleryDesc,'gallery-disclaimer':d.disclaimer,'detail-footer':d.footer,'lightbox-close':d.close};for(const [k,v]of Object.entries(simple))$(k).textContent=v;$('detail-title').innerHTML=d.title;$('metrics').innerHTML=d.stats.map(x=>'<span>'+esc(x)+'</span>').join('');$('process-list').innerHTML=d.process.map((x,i)=>'<div class="process-item"><span>0'+(i+1)+'</span><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('');$('detail-back').href='./index.html?lang='+lang+'#projects';$('nav').innerHTML='<a href="./index.html?lang='+lang+'#profile">'+esc(d.nav[0])+'</a><a href="#gallery">'+esc(d.nav[1])+'</a><a href="./index.html?lang='+lang+'#experience">'+esc(d.nav[2])+'</a>';document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false')});try{localStorage.setItem('ycw-lang',lang)}catch(e){}renderGallery()}
