<script>const copy={"ko":{"nav0":"프로젝트 요약","nav1":"해결 방법","nav2":"피드백","nav3":"KIA 직무 연결","label":"CASE STUDY 01  /  SALES PROCESS IMPROVEMENT","hero":"반복되는 견적 업무를,<br><em>현장에서 쓰는 해결책으로.</em>","lead":"영업 미팅에서 발견한 비효율을, 현장 영업사원이 사용하는 주문·마진 계산 웹 앱으로 해결했습니다.","category":"DIO IMPLANT · 실제 프로젝트","primary":"문제 발견 → 도구 제작 → 현장 사용 → 개선","see":"프로젝트 살펴보기","note":"제품명·가격·수량 등은 모두 가상 데이터로 표시","problemTag":"01 / THE CHALLENGE","problemTitle":"견적은 매번 바뀌는데,<br>도구는 따라가지 못했습니다.","problemBody":"클리닉마다 달라지는 패키지 구성 때문에 영업사원은 플라이어를 반복 수정하고 조건을 확인받아야 했습니다. 영업 미팅 통역 중 이러한 반복 업무와 고객 대기를 관찰했습니다.","problemQuote":"“자료를 더 만드는 대신, 영업사원이 직접 조건을 검토할 수는 없을까?”","solutionTag":"02 / THE SOLUTION","solutionTitle":"가격·수량·마진 판단을<br>한 화면에.","solutionBody":"AI 도구를 활용해 주문·마진 계산 웹 앱을 기획·제작했습니다. 영업사원은 자신의 Excel 가격표를 불러오고 패키지·수량을 입력한 뒤 현재 마진과 목표 마진 달성에 필요한 최소 임플란트 수량을 확인합니다.","shot1Title":"핵심 화면 ① — 계산 결과","shot1Body":"고객이 요청한 조건을 입력하면 **현재 계획의 마진**과 **목표를 충족하는 최소 수량**을 비교해 영업 제안을 검토할 수 있습니다.","shot2Title":"핵심 화면 ② — 장바구니","shot2Body":"선택한 제품과 수량을 한곳에 모아 확인하고 즉시 수정합니다. 새로운 견적을 시작할 때는 초기화 버튼을 사용합니다.","mediaCaption":"DEMO DATA — 실제 앱의 사용 흐름을 바탕으로 재구성한 공개용 화면입니다. 모든 제품명·원가·가격·마진·수량은 가상입니다.","iterationTag":"03 / USER FEEDBACK","iterationTitle":"만들고 끝내지 않았습니다.","iterationBody":"영업사원들이 앱을 사용하는 모습을 관찰하고 의견을 직접 물었습니다. 그 결과 우선순위가 높은 개선 사항 세 가지를 업데이트했습니다.","changes":[["01","핵심 정보 우선","임플란트 파라미터를 화면 위쪽으로 이동"],["02","주문을 한눈에","선택 상품을 확인하는 장바구니 추가"],["03","다음 상담 준비","주문 수량 초기화(Сбросить) 기능 추가"]],"outcomeTag":"04 / WHAT THIS PROVES","outcomeTitle":"업무 현장을 관찰하고,<br>실행 가능한 시스템으로 바꾸는 힘.","outcomeBody":"현장 문제를 파악하고 해결책을 직접 제작한 뒤, 사용자 의견을 기반으로 개선했습니다. 해당 도구는 현재 영업팀이 사용하고 있습니다. 정량적인 매출·시간 단축 효과는 아직 검증되지 않아 기재하지 않았습니다.","kiaTag":"RELEVANCE TO PRODUCT SPECIALIST","kiaTitle":"KIA에서 연결되는 역량","kiaBody":"가격·수익성을 고려하는 사고, 제품·패키지 정보를 구조화하는 역량, 현지 영업팀과의 커뮤니케이션, 사용자 피드백을 통한 개선 경험을 보여줍니다. 자동차 상품 가격을 직접 분석했다는 뜻은 아닙니다.","kiaTags":["Pricing-related reasoning","Sales enablement","Product information","Cross-functional feedback"],"extraSummary":"추가 화면 3장 보기 · 더 깊이 알고 싶은 면접관용","extraIntro":"추가 화면은 실제 앱의 구성과 사용 흐름을 참고해 제작한 가상 데이터 시연 화면입니다.","extraLabels":[["주문 조건","임플란트 수량·현재 주문 계획"],["장비 구성","고객별 장비 패키지 구성"],["제품 카탈로그","Excel 가격표를 불러와 항목 확인·수정"]],"approval":"PORTFOLIO CASE STUDY · DEMO DATA","privacy":"실제 앱의 기능과 화면 구성을 바탕으로 포트폴리오용 데모 화면을 새로 제작했습니다. 화면에 표시된 제품명, 모델명, 가격, 원가, 이익률, 수량 및 합계는 모두 가상입니다. 회사의 실제 영업 데이터는 사용하지 않았으며, 내부 앱 링크도 공개하지 않습니다.","footer":"데모 이미지는 실제 앱의 주요 사용 흐름을 설명하기 위한 예시입니다. 모든 제품과 수치는 가상이며 실제 회사의 가격 및 원가를 나타내지 않습니다.","back":"← 전체 포트폴리오"},"ru":{"nav0":"Обзор","nav1":"Решение","nav2":"Обратная связь","nav3":"Для Kia","label":"КЕЙС 01 / ОПТИМИЗАЦИЯ ПРОДАЖ","hero":"От повторяющихся расчётов<br>к <em>инструменту для отдела продаж.</em>","lead":"Увидев неэффективность подготовки предложений, я создала веб-приложение для расчёта заказа и маржинальности, которым пользуются сотрудники отдела продаж.","category":"DIO IMPLANT · РЕАЛЬНЫЙ ПРОЕКТ","primary":"Проблема → Инструмент → Использование → Улучшения","see":"Изучить кейс","note":"Все названия товаров и числа на экранах вымышлены","problemTag":"01 / ЗАДАЧА","problemTitle":"Условия менялись,<br>а подготовка занимала время.","problemBody":"Для разных клиник требовалось многократно менять состав пакетов, править материалы и согласовывать условия. Я заметила эту проблему, наблюдая за продажами во время перевода встреч.","problemQuote":"«Что, если менеджер сможет оценивать условия предложения самостоятельно?»","solutionTag":"02 / РЕШЕНИЕ","solutionTitle":"Цена, количество и маржа<br>в одном интерфейсе.","solutionBody":"С помощью AI-инструментов я спроектировала и создала веб-калькулятор. Менеджер загружает собственный Excel-прайс, выбирает пакет и количество, а затем видит маржу текущего плана и минимальное количество имплантов для целевой маржи.","shot1Title":"Экран ① — результат расчёта","shot1Body":"Сравнение маржи **текущего плана** с **минимальным количеством для целевого уровня**, чтобы оценить условия предложения.","shot2Title":"Экран ② — корзина","shot2Body":"Выбранные позиции и количество собраны в одном месте: их можно изменить или удалить, а заказ сбросить для следующего расчёта.","mediaCaption":"DEMO DATA — демонстрационный экран по мотивам реального рабочего процесса. Все модели, цены, затраты, количества и проценты вымышлены.","iterationTag":"03 / ОБРАТНАЯ СВЯЗЬ","iterationTitle":"Разработка не закончилась релизом.","iterationBody":"Я наблюдала, как менеджеры пользуются приложением, и спрашивала, что мешает работе. На основе обратной связи внесла три изменения.","changes":[["01","Главное — выше","Параметры имплантов перенесены наверх"],["02","Заказ — в одном месте","Добавлена отдельная корзина"],["03","Новый расчёт — проще","Добавлена кнопка сброса количества заказа"]],"outcomeTag":"04 / МОЙ ВКЛАД","outcomeTitle":"От наблюдения за процессом<br>к рабочему инструменту.","outcomeBody":"Я выявила задачу, создала решение и улучшила его по отзывам пользователей. Инструмент используется отделом продаж. Подтверждённых количественных показателей экономии времени или роста выручки пока нет.","kiaTag":"ДЛЯ РОЛИ PRODUCT SPECIALIST","kiaTitle":"Применимые навыки для Kia","kiaBody":"Работа с ценой и рентабельностью, структурирование продуктовых данных, коммуникация с продажами и улучшение решений по обратной связи. Это не утверждение об опыте ценообразования автомобилей.","kiaTags":["Pricing-related reasoning","Sales enablement","Product information","Cross-functional feedback"],"extraSummary":"Другие экраны · для детального ознакомления","extraIntro":"Дополнительные экраны показывают рабочие сценарии с исключительно вымышленными данными.","extraLabels":[["План заказа","Параметры импланта и количество"],["Оборудование","Состав оборудования для заказа"],["Каталог","Проверка и редактирование загруженного Excel-прайса"]],"approval":"PORTFOLIO CASE STUDY · DEMO DATA","privacy":"Для портфолио созданы новые демонстрационные экраны на основе функциональных сценариев приложения. Все наименования, модели, цены, себестоимость, проценты, количества и суммы вымышлены. Реальные коммерческие данные и ссылка на внутренний сервис не публикуются.","footer":"Все продукты и числовые значения на демонстрационных экранах вымышлены и не отражают реальные цены или себестоимость компании.","back":"← Всё портфолио"},"en":{"nav0":"Overview","nav1":"Solution","nav2":"Feedback","nav3":"For Kia","label":"CASE STUDY 01 / SALES PROCESS IMPROVEMENT","hero":"From repetitive quotations<br>to <em>a tool sales teams actually use.</em>","lead":"I identified friction in repeated package revisions and created a web app that helps sales representatives review order value and target profitability.","category":"DIO IMPLANT · COMPLETED PROJECT","primary":"Problem → Build → Field use → Iteration","see":"Explore the case","note":"All product names and figures on the screens are fictional","problemTag":"01 / THE CHALLENGE","problemTitle":"Offer conditions changed.<br>The workflow could not keep up.","problemBody":"Custom packages for different clinics meant repeated flyer revisions and condition checks. While interpreting sales meetings, I observed the extra work involved and the time customers spent waiting.","problemQuote":"“What if sales representatives could evaluate package conditions themselves?”","solutionTag":"02 / THE SOLUTION","solutionTitle":"Value, quantity and margin<br>in one workflow.","solutionBody":"I planned and built a web calculator with the help of AI tools. Sales representatives upload their own Excel price list, select package types and quantities, then check current-plan margin and the minimum implant quantity required for a target margin.","shot1Title":"Key screen ① — margin result","shot1Body":"Sales representatives compare the **current plan margin** with the **minimum quantity needed to meet a target** before making an offer.","shot2Title":"Key screen ② — order basket","shot2Body":"Selected products and quantities are visible together, can be adjusted quickly, and can be reset for the next quotation.","mediaCaption":"DEMO DATA — a recreated screen illustrating the actual workflow. All models, prices, costs, quantities, and margins are fictional.","iterationTag":"03 / USER FEEDBACK","iterationTitle":"I did not stop at the first release.","iterationBody":"I watched sales representatives use the app and asked for their feedback. Three practical UX changes followed.","changes":[["01","Important inputs first","Moved implant parameters to the top of the screen"],["02","One clear order view","Added a separate basket for selected products"],["03","Faster next quotation","Added a reset button for order quantities"]],"outcomeTag":"04 / WHAT THIS PROVES","outcomeTitle":"Turning frontline observations<br>into a practical system.","outcomeBody":"I identified a workflow problem, built a solution, and improved it with user feedback. The tool is currently used by the sales team. No unverified time-saving or revenue figures are claimed.","kiaTag":"RELEVANCE TO PRODUCT SPECIALIST","kiaTitle":"Transferable value for Kia","kiaBody":"Pricing-related reasoning, product/package information structure, collaboration with sales and feedback-driven iteration. This does not imply previous automotive pricing experience.","kiaTags":["Pricing-related reasoning","Sales enablement","Product information","Cross-functional feedback"],"extraSummary":"Explore three extra screens · optional detail","extraIntro":"Additional screens show the app workflow using entirely fictional sample data.","extraLabels":[["Order plan","Implant parameters and quantity"],["Equipment","Equipment items in an order"],["Catalog","Review and edit an imported Excel price list"]],"approval":"PORTFOLIO CASE STUDY · DEMO DATA","privacy":"These portfolio demo screens have been recreated to illustrate how the real app works. All product names, models, prices, costs, percentages, quantities, and totals are fictional. Actual commercial information and the internal app link are not published.","footer":"Demo screenshots show illustrative workflows only. Every product and figure is fictional and does not represent real company pricing or costs.","back":"← Full portfolio"}};const pictures=["assets/diosale-demo-calculation.svg","assets/diosale-demo-basket.svg","assets/diosale-demo-order.svg","assets/diosale-demo-equipment.svg","assets/diosale-demo-catalog.svg"];const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function setLang(lang){const t=copy[lang];if(!t)return;document.documentElement.lang=lang;const back=document.getElementById('back-to-portfolio');if(back)back.href='index.html?lang='+encodeURIComponent(lang)+'#projects';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]});document.querySelectorAll('[data-h]').forEach(el=>{el.innerHTML=t[el.dataset.h]});document.querySelectorAll('[data-bold]').forEach(el=>{el.innerHTML=esc(t[el.dataset.bold]).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')});document.getElementById('changes').innerHTML=t.changes.map(c=>'<article class="improve"><div class="num">'+esc(c[0])+'</div><h3>'+esc(c[1])+'</h3><p>'+esc(c[2])+'</p></article>').join('');document.getElementById('tags').innerHTML=t.kiaTags.map(x=>'<span>'+esc(x)+'</span>').join('');document.getElementById('extra').innerHTML=t.extraLabels.map((x,i)=>'<article class="extra-card"><img loading="lazy" src="'+pictures[i+2]+'" alt="Fictional sample screen '+(i+1)+'"><h4>'+esc(x[0])+'</h4><p>'+esc(x[1])+'</p></article>').join('');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));}document.getElementById('primary1').src=pictures[0];document.getElementById('primary2').src=pictures[4];document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang((new URLSearchParams(location.search).get('lang')||'ko').toLowerCase());</script></body></html>
