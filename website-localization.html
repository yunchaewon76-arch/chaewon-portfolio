урентов","Information Architecture · Структура новостей, мероприятий и библиотеки","Conversion Path Optimization · Упрощение регистрации на семинары","DIO NAVI Order Experience · Самостоятельные планирование, дизайн и реализация заказа"],"roleTitle":"Что я делала","note":"Я не утверждаю, что самостоятельно разработала весь сайт. Страницу заказа DIO NAVI я спланировала, оформила и реализовала сама. Рост конверсии не заявлен без подтверждённых данных.","back":"← Всё портфолио","caption":"Ссылки на опубликованные разделы сайта и страницу заказа","cases":[["INFORMATION ARCHITECTURE","Упростить поиск нужной информации","Я продумывала структуру новостей, мероприятий и библиотеки, учитывая привычные для российских пользователей сценарии и количество кликов."],["CONVERSION PATH OPTIMIZATION","Упростить регистрацию на семинары","Я анализировала путь от интереса к событию до заявки и стремилась сократить лишние шаги и усложнения."],["DIGITAL ORDER EXPERIENCE","Самостоятельная разработка страницы заказа DIO NAVI","Я спланировала, спроектировала и реализовала страницу, где клиент выбирает услугу и количество, видит стоимость, прикрепляет файл и оставляет контактные данные."]],"lesson":"На этом проекте я убедилась, что хороший интерфейс помогает клиенту не только найти сведения, но и завершить нужное действие.","linkText":"Открыть сайт ↗"},"en":{"title":"Website Localization","eyebrow":"PROJECT 03 / WEBSITE LOCALIZATION","h1":"Localized a website around<br>the Russian customer journey.","intro":"From September 2025 to February 2026, I researched competitor sites and worked on information architecture, user flows, and localized content. I also designed and implemented the DIO NAVI online order page.","period":"Sep 2025 — Feb 2026","roles":["Competitive Benchmarking · Researching local competitors' sites","Information Architecture · Structuring news, events and educational resources","Conversion Path Optimization · Simplifying seminar registration flow","DIO NAVI Order Experience
